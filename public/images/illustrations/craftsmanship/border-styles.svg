<rect class="line" x="940" y="220" width="430" height="180" rx="4"/><rect class="guide" x="965" y="245" width="380" height="130" rx="2"/>
<path class="line" d="M230 610H660M940 610H1370"/>
<path class="fine" d="M250 570Q275 650 300 570T350 570T400 570T450 570T500 570T550 570T600 570T650 570"/>
<path class="fine" d="M960 570L1000 650L1040 570L1080 650L1120 570L1160 650L1200 570L1240 650L1280 570L1320 650L1360 570"/>
</svg>